# Docker Compose
#
# Local development (Spring Boot Docker Compose auto-starts the db service):
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=vdz
#
# Full-stack Docker deployment (database + application container):
#   docker compose up -d              # start PostgreSQL + app (default: vdz profile)
#   docker compose up -d db           # start PostgreSQL only
#   docker compose logs -f app        # tail application logs
#   docker compose down -v            # stop and remove volumes

services:

  db:
    image: postgres:18-alpine
    container_name: speakercards-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: speakercards
      POSTGRES_USER: speakercards
      POSTGRES_PASSWORD: speakercards
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speakercards"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: [deploy]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speakercards-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/speakercards
      SPRING_DATASOURCE_USERNAME: speakercards
      SPRING_DATASOURCE_PASSWORD: speakercards
      SPRING_PROFILES_ACTIVE: vdz
    volumes:
      - speaker_photos:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

volumes:
  postgres_data:
  speaker_photos:
