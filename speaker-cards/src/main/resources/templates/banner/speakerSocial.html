<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${speaker.firstName} + ' ' + ${speaker.lastName} + ' — Social Card'">Social Card</title>
  <style>
    @font-face {
      font-family: 'Roboto Mono';
      font-style: normal;
      font-weight: 400;
      src: url('/static/fonts/RobotoMonoRegular.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Roboto Mono';
      font-style: normal;
      font-weight: 300;
      src: url('/static/fonts/RobotoMonoLight.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Roboto Mono';
      font-style: normal;
      font-weight: 700;
      src: url('/static/fonts/RobotoMonoBold.ttf') format('truetype');
    }

    @page {
      size: 1080px 1080px;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      font-family: "Roboto Mono", monospace;
      color: #ffffff;
    }

    /* Mirrored background */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('/static/images/backgroundSocial.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: scaleX(-1);
      z-index: 0;
    }

    .intro-text {
      position: absolute;
      top: 80px;
      left: 60px;
      font-size: 32px;
      font-weight: 300;
      color: #ffffff;
      font-family: "Roboto Mono", monospace;
      z-index: 10;
    }

    .talk-title {
      position: absolute;
      top: 140px;
      left: 60px;
      right: 60px;
      font-size: 56px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.3;
      font-family: "Roboto Mono", monospace;
      word-wrap: break-word;
      z-index: 10;
    }

    .speaker-section {
      position: absolute;
      top: 380px;
      left: 60px;
      right: 60px;
      z-index: 10;
    }

    .speaker-section table {
      width: 100%;
      border-collapse: collapse;
    }

    .speaker-section td {
      vertical-align: top;
      padding: 0;
    }

    .speaker-name {
      font-size: 64px;
      font-weight: 700;
      color: #ffffff;
      font-family: "Roboto Mono", monospace;
      word-wrap: break-word;
    }

    /* Speaker photo circle */
    .speaker-photo-wrapper {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      z-index: 150;
      padding: 12px;
      background-image: url('/static/images/background.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      margin-left: auto;
    }

    .speaker-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .speaker-title {
      font-size: 28px;
      color: #ffb84d;
      font-weight: 400;
      font-family: "Roboto Mono", monospace;
      margin-top: 20px;
    }

    /* Date and times */
    .date-time {
      position: absolute;
      bottom: 260px;
      left: 60px;
      font-size: 32px;
      color: #ffffff;
      font-family: "Roboto Mono", monospace;
      z-index: 10;
      line-height: 1.5;
    }

    /* Event tile – bottom right */
    #top-logo {
      position: absolute;
      bottom: 60px;
      right: 30px;
      z-index: 10;
      height: 150px;
      width: 150px;
    }

    #top-logo img {
      width: auto;
      height: 100px;
      display: block;
    }

    /* Conference badge – bottom left */
    .conference-banner {
      position: absolute;
      bottom: 110px;
      left: 30px;
      z-index: 10;
      padding: 12px 24px;
      border-radius: 12px;
      background-color: #f38113;
      font-weight: 400;
      font-size: 54px;
      color: #ffffff;
      font-family: "Roboto Mono", monospace;
      white-space: nowrap;
    }

    /* Conference URL bar */
    .conference-url {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      background-color: #1a237e;
      color: #ffffff;
      font-family: "Roboto Mono", monospace;
      font-size: 24px;
      padding: 15px 30px;
      text-align: center;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div class="intro-text">I am speaking about:</div>

  <div class="talk-title"
       th:if="${talk != null and talk.title != null}"
       th:text="${talk.title}">Talk Title</div>

  <!-- Speaker name and photo -->
  <div class="speaker-section">
    <table>
      <tr>
        <td>
          <div class="speaker-name"
               th:text="${speaker.firstName} + ' ' + ${speaker.lastName}">Speaker Name</div>
        </td>
        <td rowspan="2">
          <div class="speaker-photo-wrapper">
            <div class="speaker-photo-inner"
                 th:style="${speaker.id != null}
                     ? 'background-image: url(/speaker-photo/' + ${speaker.id} + ')'
                     : 'background-color: #ff9800;'">
            </div>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="speaker-title"
               th:if="${speaker.title != null and !#strings.isEmpty(speaker.title)}"
               th:text="${speaker.title}">Speaker Title</div>
        </td>
      </tr>
    </table>
  </div>

  <!-- Date and time block -->
  <div class="date-time" th:if="${talk != null}">
    <span th:if="${talk.date != null}"
          th:text="${T(com.fortytwotalents.util.TemplateUtils).formatDate(talk.date)}"></span>
    <br th:if="${talk.date != null and talk.cetTime != null and talk.estTime != null}" />
    <span th:if="${talk.cetTime != null and talk.estTime != null}">
      <span th:text="${T(com.fortytwotalents.util.TemplateUtils).formatTime(talk.cetTime)}"></span>
      -<span th:text="${T(com.fortytwotalents.util.TemplateUtils).addHour(talk.cetTime)}"></span> CET
      &nbsp;|&nbsp;
      <span th:text="${T(com.fortytwotalents.util.TemplateUtils).formatTime(talk.estTime)}"></span>
      -<span th:text="${T(com.fortytwotalents.util.TemplateUtils).addHour(talk.estTime)}"></span> EST
    </span>
  </div>

  <!-- Conference badge -->
  <div class="conference-banner" th:text="${event.shortName}">VDZ '26</div>

  <!-- Event tile / logo -->
  <div id="top-logo">
    <img th:src="@{/static/images/} + ${event.logoFile}" alt="Event Logo" />
  </div>

  <!-- Conference URL footer -->
  <div class="conference-url" th:text="${event.url}">https://voxxeddays.com/zurich/</div>
</body>
</html>
