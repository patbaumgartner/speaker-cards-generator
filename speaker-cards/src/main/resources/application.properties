# =============================================================================
# Speaker Cards Generator – application configuration
# =============================================================================

# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080

# ── Database (PostgreSQL) ───────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/speakercards
spring.datasource.username=speakercards
spring.datasource.password=speakercards
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ── Thymeleaf ────────────────────────────────────────────────────────────────
spring.thymeleaf.cache=false

# ── Event configuration (active profile overrides these defaults) ────────────
# Override with: --spring.profiles.active=vdz  (or vdt, vdcern)
app.event.name=Voxxed Days Z\u00fcrich
app.event.short-name=VDZ '26
app.event.url=https://voxxeddays.com/zurich/
# Image file in src/main/resources/static/images/ used as the banner background tile
app.event.logo-file=event-tile.png

# ── Devoxx CFP API ───────────────────────────────────────────────────────────
# Speakers can be imported via: GET /api/import/devoxx
# or for a specific event:      GET /api/import/devoxx/{eventId}
app.devoxx.api.base-url=https://m.devoxx.com
app.devoxx.api.event-id=vdz26
