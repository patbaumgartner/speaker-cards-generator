name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement! Please describe your idea as clearly as possible.

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does your feature solve? What use-case does it address?
      placeholder: "I often need to generate banners for all social media platforms at once, but currently I have to trigger each endpoint separately."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative approaches or workarounds?

  - type: dropdown
    id: scope
    attributes:
      label: Feature Scope
      options:
        - "Banner generation"
        - "Speaker import (XLSX / Devoxx API)"
        - "Web UI"
        - "Configuration / profiles"
        - "Docker / deployment"
        - "CI/CD"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate.
          required: true
        - label: I am willing to submit a pull request to implement this feature.
