version: 2
updates:
- package-ecosystem: maven
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 10
  groups:
    spring-boot:
      patterns:
      - org.springframework.boot:*
      - org.springframework:*
      update-types:
      - minor
      - patch
    pdf-rendering:
      patterns:
      - com.openhtmltopdf:*
      - org.apache.pdfbox:*
      update-types:
      - minor
      - patch
    apache-poi:
      patterns:
      - org.apache.poi:*
      update-types:
      - minor
      - patch
    webjars:
      patterns:
      - org.webjars*:*
      update-types:
      - minor
      - patch
    test-deps:
      patterns:
      - org.junit*:*
      - org.mockito:*
      - org.assertj:*
      - com.h2database:*
      update-types:
      - minor
      - patch
  labels:
  - dependencies
  - maven
  commit-message:
    prefix: chore(deps)
    prefix-development: chore(deps-dev)
    include: scope
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - github-actions
  commit-message:
    prefix: ci(deps)
    include: scope
- package-ecosystem: docker
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: chore(deps)
    prefix-development: chore(deps-dev)
    include: scope
- package-ecosystem: docker-compose
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: 06:00
    timezone: Europe/Zurich
  open-pull-requests-limit: 5
  labels:
  - dependencies
  - docker
  commit-message:
    prefix: chore(deps)
    prefix-development: chore(deps-dev)
    include: scope
