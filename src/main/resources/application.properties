server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/speakercards
spring.datasource.username=speakercards
spring.datasource.password=speakercards
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

logging.level.com.openhtmltopdf=WARN

# Where imported speaker profile pictures are written at runtime. Relative paths resolve
# against the working directory; mount this as a volume when running in a container.
app.storage.photo-dir=data/speaker-photos
app.storage.max-photo-size=5MB

# Activate an event profile with: --spring.profiles.active=vdz  (or vdt, vdcern, baselone)
# Event-specific config (name, logo, colors, dates) lives entirely in the profile properties files.
# Running without a profile is not recommended — no event branding will be configured.
app.event.session-label=Session
app.event.speaking-about-label=I am speaking about

# Speakers can be imported via: GET /api/import/devoxx or GET /api/import/devoxx/{eventId}
# URL pattern: https://{eventId}.cfp.dev/api/public/speakers
# Set to 'none' (or leave empty) to disable CFP API import for a profile.
