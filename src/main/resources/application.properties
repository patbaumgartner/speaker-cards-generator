server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/speakercards
spring.datasource.username=speakercards
spring.datasource.password=speakercards
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Override with: --spring.profiles.active=vdz  (or vdt, vdcern, baselone)
app.event.name=Voxxed Days Z\u00FCrich
app.event.short-name=VDZ26
app.event.url=https://vdz26.voxxeddays.ch
app.event.logo-file=logo-vdz.png
app.event.date=March 24, 2026
app.event.location=Z\u00FCrich, Switzerland
app.event.color-primary=#1e2246
app.event.color-accent=#40b4e5
app.event.session-label=Session
app.event.speaking-about-label=I am speaking about

# Speakers can be imported via: GET /api/import/devoxx or GET /api/import/devoxx/{eventId}
# URL pattern: https://{eventId}.cfp.dev/api/public/speakers
app.devoxx.api.event-id=vdz26
