server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/speakercards
spring.datasource.username=speakercards
spring.datasource.password=speakercards
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# Override with: --spring.profiles.active=vdz  (or vdt, vdcern)
app.event.name=Voxxed Days Z\u00fcrich
app.event.short-name=VDZ '26
app.event.url=https://voxxeddays.com/zurich/
app.event.logo-file=event-tile.png

# Speakers can be imported via: GET /api/import/devoxx or GET /api/import/devoxx/{eventId}
app.devoxx.api.base-url=https://m.devoxx.com
app.devoxx.api.event-id=vdz26
