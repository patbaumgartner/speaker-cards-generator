<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <style th:fragment="signatureStyle" th:inline="text">
      @font-face {
        font-family: "Inter";
        font-weight: 400;
        src: url("/fonts/Inter-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Space Grotesk";
        font-weight: 700;
        src: url("/fonts/SpaceGrotesk-Bold.ttf") format("truetype");
      }
      .event-date,
      .event-secondary-date,
      .footer-url,
      .campaign-tag,
      .campaign-motto {
        font-family: "Space Grotesk", sans-serif;
      }
      .campaign-signature {
        position: absolute;
        right: 50px;
        top: 50%;
        transform: translateY(-50%);
        text-align: right;
      }
      .event-schedule {
        position: absolute;
        left: 380px;
        right: 300px;
        top: 50%;
        transform: translateY(-50%);
        color: #ffffff;
        text-align: center;
      }
      .event-date {
        font-size: 26px;
        font-weight: 700;
        line-height: 1.2;
        letter-spacing: -0.5px;
        white-space: nowrap;
      }
      .event-secondary-date {
        font-size: 14px;
        font-weight: 400;
        line-height: 1.2;
        white-space: nowrap;
      }
      .event-location {
        font-size: 16px;
        font-weight: 400;
        line-height: 1.2;
      }
      .footer-url {
        position: absolute;
        left: 50px;
        top: 20px;
        color: #ffffff;
        font-size: 38px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -1px;
      }
      .campaign-tag {
        color: #ffffff;
        font-size: 48px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: -1.5px;
      }
      .campaign-motto {
        position: absolute;
        right: 50px;
        top: 50%;
        transform: translateY(-50%);
        padding-right: 76px;
        white-space: nowrap;
        color: #ffffff;
        font-size: 30px;
        font-weight: 700;
        line-height: 1.2;
      }
      .campaign-switch {
        position: absolute;
        right: 0;
        top: 3px;
        width: 60px;
        height: 30px;
      }
      .session-type-divider {
        width: 80px;
        height: 3px;
        margin-top: 20px;
        background: [[${event.colorAccent}]];
      }
      .session-type-label {
        margin-top: 16px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 20px;
        font-weight: 700;
        line-height: 1.2;
        color: [[${event.colorPrimary}]];
      }
    </style>
  </head>
  <body>
    <div th:fragment="sessionTypeDetails" th:if="${conferenceSession != null and !#strings.isEmpty(conferenceSession.sessionTypeLabel)}">
      <div class="session-type-divider"></div>
      <div th:replace="~{banner/fragments/lighting :: sessionTypeLabel}"></div>
    </div>
    <div th:fragment="sessionTypeLabel" class="session-type-label"
      th:if="${conferenceSession != null and !#strings.isEmpty(conferenceSession.sessionTypeLabel)}" th:text="${conferenceSession.sessionTypeLabel}"></div>
    <div th:fragment="schedule" class="event-schedule"
      th:with="workshop=${conferenceSession != null and conferenceSession.workshop and !#strings.isEmpty(event.workshopDate)}">
      <div class="event-date" th:if="${workshop or !#strings.isEmpty(event.date)}"
        th:text="${workshop ? event.workshopDate : event.date}"></div>
      <div class="event-secondary-date"
        th:if="${workshop and event.hasDistinctWorkshopDate() and !#strings.isEmpty(event.date)}"
        th:text="'Conference Day: ' + ${event.date}"></div>
      <div class="event-secondary-date"
        th:if="${!workshop and conferenceSession == null and event.hasDistinctWorkshopDate() and !#strings.isEmpty(event.workshopDate)}"
        th:text="'Workshop Day: ' + ${event.workshopDate}"></div>
      <div class="event-location" th:if="${!#strings.isEmpty(event.location)}" th:text="${event.location}"></div>
    </div>
    <div
      th:fragment="website"
      class="footer-url"
      th:if="${!#strings.isEmpty(event.url)}"
      th:text="${event.url.replaceFirst('^https?://', '').replaceFirst('/$', '')}"
    >
      voxxeddays.ch
    </div>
    <div th:fragment="signature" class="campaign-signature">
      <div class="campaign-tag" th:text="'#' + ${event.shortName}">#vdz27</div>
    </div>
    <div th:fragment="motto" class="campaign-motto">
      We turn on the lights.
      <svg
        class="campaign-switch"
        xmlns="http://www.w3.org/2000/svg"
        width="60"
        height="30"
        viewBox="0 0 60 30"
        aria-hidden="true"
      >
        <rect
          x="1"
          y="1"
          width="58"
          height="28"
          rx="14"
          th:attr="fill=${event.colorSecondary},stroke=${event.colorAccent}"
          stroke-width="2"
        />
        <circle cx="44" cy="15" r="12" fill="#FFFFFF" />
      </svg>
    </div>
    <svg
      th:fragment="stage(width, height, orientation)"
      class="lighting"
      xmlns="http://www.w3.org/2000/svg"
      th:attr="width=${width},height=${height}"
      viewBox="0 0 1280 526"
      preserveAspectRatio="none"
      aria-hidden="true"
    >
      <defs>
        <linearGradient id="stage-wash" x1="0%" y1="65%" x2="100%" y2="30%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="44%" stop-color="#F8FAFC" />
          <stop offset="80%" th:attr="stop-color=${event.colorSecondary}" stop-opacity=".22" />
          <stop offset="100%" th:attr="stop-color=${event.colorAccent}" stop-opacity=".42" />
        </linearGradient>
        <linearGradient id="tube-light" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" th:attr="stop-color=${event.colorSecondary}" />
          <stop offset="55%" th:attr="stop-color=${event.colorPrimary}" />
          <stop offset="100%" th:attr="stop-color=${event.colorAccent}" />
        </linearGradient>
      </defs>
      <g th:attr="transform=${orientation}">
        <rect width="1280" height="526" fill="url(#stage-wash)" />
        <!-- Bent light tubes share a translucent halo and a white-hot core. -->
        <g fill="none" stroke-linejoin="round">
          <path
            id="tubes"
            d="M740 565 L1040 45 Q1065 2 1115 2 L1300 2 M845 565 L1120 89 Q1145 46 1195 46 L1300 46 M950 565 L1200 133 Q1225 90 1275 90 L1300 90"
            stroke="url(#tube-light)"
            stroke-width="30"
            opacity=".09"
          />
          <path
            d="M740 565 L1040 45 Q1065 2 1115 2 L1300 2 M845 565 L1120 89 Q1145 46 1195 46 L1300 46 M950 565 L1200 133 Q1225 90 1275 90 L1300 90"
            stroke="url(#tube-light)"
            stroke-width="8"
            opacity=".6"
          />
          <path
            d="M740 565 L1040 45 Q1065 2 1115 2 L1300 2 M845 565 L1120 89 Q1145 46 1195 46 L1300 46 M950 565 L1200 133 Q1225 90 1275 90 L1300 90"
            stroke="#FFFFFF"
            stroke-width="4"
          />
        </g>
      </g>
    </svg>
  </body>
</html>
