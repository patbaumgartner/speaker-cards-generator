<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${speaker.displayName()} + ' — Speaker Card'">Speaker Card</title>
    <style th:inline="text">
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 300;
        src: url("/fonts/Poppins-Light.ttf") format("truetype");
      }

      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/Poppins-Regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 600;
        src: url("/fonts/Poppins-SemiBold.ttf") format("truetype");
      }

      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 700;
        src: url("/fonts/Poppins-Bold.ttf") format("truetype");
      }

      @page {
        size: 1280px 720px;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1280px;
        height: 720px;
        position: relative;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        color: #0F172A;
        background: #ffffff;
      }

      /* Event-color header bar for logo */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 110px;
        background: [[${event.colorPrimary}]];
        z-index: 10;
      }

      .header-logo {
        position: absolute;
        top: 18px;
        left: 50px;
      }

      .header-logo img {
        height: 75px;
        width: auto;
        display: block;
      }

      /* Accent separator line below header */
      .accent-line {
        position: absolute;
        top: 110px;
        left: 0;
        width: 1280px;
        height: 4px;

        background: [[${event.colorAccent}]];
        z-index: 10;
      }

      /* Base beneath the stage lighting */
      .body-area {
        position: absolute;
        top: 114px;
        left: 0;
        width: 1280px;
        height: 526px;

        background-color: #F8FAFC;
        z-index: 1;
      }

      /* Event-coloured stage lighting */
      .lighting {
        position: absolute;
        top: 114px;
        left: 0;
        width: 1280px;
        height: 526px;
        display: block;
        z-index: 2;
      }

      /* Portrait with an accent ring */
      .speaker-photo-wrapper {
        position: absolute;
        left: 50px;
        top: 217px;
        width: 310px;
        height: 310px;
        border-radius: 50%;
        padding: 5px;

        background-color: [[${event.colorAccent}]];
        z-index: 10;
      }

      .speaker-photo-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        overflow: hidden;
      }

      /* Speaker info: right side */
      .speaker-info {
        position: absolute;
        left: 420px;
        top: 377px;
        transform: translateY(-50%);
        width: 800px;
        z-index: 10;
      }

      #company {
        font-family: "Poppins", sans-serif;
        font-size: 16px;
        font-weight: 400;

        color: [[${event.colorPrimary}]];
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }

      #name {
        font-family: "Poppins", sans-serif;
        font-size: 51px;
        font-weight: 700;
        color: #0F172A;
        line-height: 1.15;
        margin-bottom: 6px;
        text-align: left;
        hyphens: none;
        word-wrap: break-word;
      }

      #role {
        font-family: "Poppins", sans-serif;
        font-size: 18px;
        font-weight: 300;
        color: #475569;
        letter-spacing: 1px;
        margin-bottom: 22px;
      }

      .separator {
        width: 60px;
        height: 3px;

        background: [[${event.colorAccent}]];
        margin-bottom: 20px;
      }

      #talk-title {
        font-family: "Poppins", sans-serif;
        font-size: 44px;
        font-weight: 600;
        color: #1E293B;
        line-height: 1.3;
        text-align: left;
        hyphens: none;
        word-wrap: break-word;
      }

      /* Event-primary footer */
      .footer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1280px;
        height: 80px;

        background: [[${event.colorPrimary}]];
        z-index: 10;
      }

    </style>
    <style th:replace="~{banner/fragments/lighting :: signatureStyle}"></style>
  </head>

  <body>
    <!-- Event-color header with logo and hashtag -->
    <div class="header">
      <div class="header-logo">
        <img th:src="'/images/' + ${event.logoFile}" alt="Event Logo" />
      </div>
      <div th:replace="~{banner/fragments/lighting :: schedule}"></div>
      <div th:replace="~{banner/fragments/lighting :: signature}"></div>
    </div>

    <!-- Accent line separator -->
    <div class="accent-line"></div>

    <!-- Primary body with the "lights on" overlay -->
    <div class="body-area"></div>
    <div th:replace="~{banner/fragments/lighting :: stage(1280, 526, 'translate(1280 0) scale(-1 1)')}"></div>

    <!-- Speaker photo -->
    <div class="speaker-photo-wrapper">
      <div
        class="speaker-photo-inner"
        th:style="${speaker.id != null}
             ? 'background-image: url(/speaker-photo/' + ${speaker.id} + ')'
             : 'background-image: url(/speaker-photo)'"
      ></div>
    </div>

    <!-- Speaker information -->
    <div class="speaker-info">
      <div
        id="company"
        th:if="${speaker.company != null and !#strings.isEmpty(speaker.company)}"
        th:text="${speaker.company}"
      >
        Company
      </div>

      <div id="name" th:text="${speaker.displayName()}">Speaker Name</div>

      <div id="role" th:if="${speaker.title != null and !#strings.isEmpty(speaker.title)}" th:text="${speaker.title}">
        Speaker Title
      </div>

      <div class="separator"></div>

      <div
        id="talk-title"
        th:if="${talk != null and talk.title != null}"
        th:utext="${talk.formattedTitle != null ? talk.formattedTitle : utils.formatTitle(talk.title, 800, 44, 600)}"
      >
        Talk Title
      </div>
    </div>

    <!-- Accent footer with event info -->
    <div class="footer">
      <div th:replace="~{banner/fragments/lighting :: motto}"></div>
      <div th:replace="~{banner/fragments/lighting :: website}"></div>
    </div>
  </body>
</html>
