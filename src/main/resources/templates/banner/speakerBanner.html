<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title th:text="${speaker.firstName} + ' ' + ${speaker.lastName} + ' — Speaker Card'">Speaker Card</title>
  <style th:inline="text">
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 300;
      src: url('/fonts/Poppins-Light.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 400;
      src: url('/fonts/Poppins-Regular.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 600;
      src: url('/fonts/Poppins-SemiBold.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 700;
      src: url('/fonts/Poppins-Bold.ttf') format('truetype');
    }

    @page {
      size: 1280px 720px;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      background: #ffffff;
    }

    /* White header bar for logo */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 110px;
      background: #ffffff;
      z-index: 10;
    }

    .header-logo {
      position: absolute;
      top: 18px;
      left: 50px;
    }

    .header-logo img {
      height: 75px;
      width: auto;
      display: block;
    }

    .header-hashtag {
      position: absolute;
      top: 32px;
      right: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 40px;
      font-weight: 600;
      color: #999999;
      letter-spacing: 1px;
    }

    /* Accent separator line below header */
    .accent-line {
      position: absolute;
      top: 110px;
      left: 0;
      width: 1280px;
      height: 4px;

      background: [[${event.colorAccent}]];
      z-index: 10;
    }

    /* Primary gradient body */
    .body-area {
      position: absolute;
      top: 114px;
      left: 0;
      width: 1280px;
      height: 526px;

      background-color: [[${event.colorPrimary}]];
      z-index: 1;
    }

    /* Subtle accent shimmer in body */
    .body-accent {
      position: absolute;
      top: 114px;
      left: 0;
      width: 1280px;
      height: 526px;

      background-color: transparent;
      z-index: 2;
    }

    /* Speaker photo circle with accent gradient border */
    .speaker-photo-wrapper {
      position: absolute;
      left: 50px;
      top: 190px;
      width: 310px;
      height: 310px;
      border-radius: 50%;
      padding: 5px;

      background-color: [[${event.colorAccent}]];
      z-index: 10;
    }

    .speaker-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    /* Speaker info: right side */
    .speaker-info {
      position: absolute;
      left: 420px;
      top: 140px;
      width: 800px;
      z-index: 10;
    }

    #company {
      font-family: 'Poppins', sans-serif;
      font-size: 16px;
      font-weight: 400;

      color: [[${event.colorAccent}]];
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    #name {
      font-family: 'Poppins', sans-serif;
      font-size: 51px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.15;
      margin-bottom: 6px;
      text-align: left;
      hyphens: none;
      word-wrap: break-word;
    }

    #role {
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 1px;
      margin-bottom: 22px;
    }

    .separator {
      width: 60px;
      height: 3px;

      background: [[${event.colorAccent}]];
      margin-bottom: 20px;
    }

    #talk-title {
      font-family: 'Poppins', sans-serif;
      font-size: 44px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.92);
      line-height: 1.3;
      text-align: left;
      hyphens: none;
      word-wrap: break-word;
    }

    /* Accent footer bar */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1280px;
      height: 80px;

      background: [[${event.colorAccent}]];
      z-index: 10;
    }

    .footer-left {
      position: absolute;
      bottom: 26px;
      left: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      z-index: 11;
    }

    .footer-right {
      position: absolute;
      bottom: 26px;
      right: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      z-index: 11;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <!-- White header with logo and hashtag -->
  <div class="header">
    <div class="header-logo">
      <img th:src="'/images/' + ${event.logoFile}" alt="Event Logo" />
    </div>
    <div class="header-hashtag" th:text="'#' + ${event.shortName}">#VDZ26</div>
  </div>

  <!-- Accent line separator -->
  <div class="accent-line"></div>

  <!-- Primary gradient body -->
  <div class="body-area"></div>
  <div class="body-accent"></div>

  <!-- Speaker photo -->
  <div class="speaker-photo-wrapper">
    <div class="speaker-photo-inner" th:style="${speaker.id != null}
             ? 'background-image: url(/speaker-photo/' + ${speaker.id} + ')'
             : 'background-color: ' + ${event.colorPrimary} + ';'">
    </div>
  </div>

  <!-- Speaker information -->
  <div class="speaker-info">
    <div id="company" th:if="${speaker.company != null and !#strings.isEmpty(speaker.company)}"
      th:text="${speaker.company}">Company</div>

    <div id="name" th:text="${speaker.firstName} + ' ' + ${speaker.lastName}">Speaker Name</div>

    <div id="role" th:if="${speaker.title != null and !#strings.isEmpty(speaker.title)}" th:text="${speaker.title}">
      Speaker Title</div>

    <div class="separator"></div>

    <div id="talk-title" th:if="${talk != null and talk.title != null}"
      th:utext="${talk.formattedTitle != null ? talk.formattedTitle : utils.formatTitle(talk.title, 800, 44, 600)}">
      Talk Title
    </div>
  </div>

  <!-- Accent footer with event info -->
  <div class="footer"></div>
  <div class="footer-left">
    <span th:if="${event.date != null and !#strings.isEmpty(event.date)}" th:text="${event.date}"></span>
    <span
      th:if="${event.date != null and !#strings.isEmpty(event.date) and event.location != null and !#strings.isEmpty(event.location)}">
      &#183; </span>
    <span th:if="${event.location != null and !#strings.isEmpty(event.location)}" th:text="${event.location}"></span>
  </div>
  <div class="footer-right" th:text="${event.url}">https://voxxeddays.ch</div>
</body>

</html>
