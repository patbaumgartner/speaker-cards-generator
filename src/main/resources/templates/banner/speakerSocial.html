<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${speaker.displayName()} + ' — Social Banner'">Social Banner</title>
    <style th:inline="text">
      @page {
        size: 1080px 1080px;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1080px;
        height: 1080px;
        position: relative;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        color: #0F172A;
        background: #ffffff;
      }

      /* Event-color header */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 120px;
        background: [[${event.colorPrimary}]];
        z-index: 10;
      }

      .header-logo {
        position: absolute;
        top: 20px;
        left: 50px;
      }

      .header-logo img {
        height: 80px;
        width: auto;
        display: block;
      }

      /* Accent line below header */
      .accent-line {
        position: absolute;
        top: 120px;
        left: 0;
        width: 1080px;
        height: 4px;

        background: [[${event.colorAccent}]];
        z-index: 10;
      }

      /* Base beneath the stage lighting */
      .body-area {
        position: absolute;
        top: 124px;
        left: 0;
        width: 1080px;
        height: 856px;

        background-color: #F8FAFC;
        z-index: 1;
      }

      /* Event-coloured stage lighting */
      .lighting {
        position: absolute;
        top: 124px;
        left: 0;
        width: 1080px;
        height: 856px;
        display: block;
        z-index: 2;
      }

      /* Intro text */
      .intro-text {
        position: absolute;
        top: 155px;
        left: 50px;
        font-family: "Space Grotesk", sans-serif;
        font-size: 18px;
        font-weight: 700;

        color: [[${event.colorPrimary}]];
        letter-spacing: 2px;
        text-transform: uppercase;
        white-space: nowrap;
        z-index: 10;
      }

      /* Talk title: top offset centers a two-line title between the label and the speaker name, above the divider */
      .talk-title {
        position: absolute;
        bottom: 560px;
        left: 50px;
        right: 50px;
        z-index: 10;
      }

      .talk-title-text {
        font-family: "Space Grotesk", sans-serif;
        font-size: 62px;
        font-weight: 700;
        color: #0F172A;
        line-height: 1.2;
        text-align: left;
        hyphens: none;
        word-wrap: break-word;
      }

      /* Separator line */
      .section-divider {
        position: absolute;
        top: 540px;
        left: 50px;
        width: 80px;
        height: 3px;

        background: [[${event.colorAccent}]];
        z-index: 10;
      }

      /* Speaker section */
      .speaker-section {
        position: absolute;
        bottom: 140px;
        left: 50px;
        right: 50px;
        z-index: 10;
      }

      .speaker-section table {
        width: 100%;
        border-collapse: collapse;
      }

      .speaker-section td {
        vertical-align: middle;
        padding: 0;
      }

      .speaker-info-cell {
        text-align: left;
      }

      .speaker-photo-cell {
        text-align: right;
        width: 316px;
      }

      .speaker-name {
        font-family: "Space Grotesk", sans-serif;
        font-size: 55px;
        font-weight: 700;
        color: #0F172A;
        word-wrap: break-word;
        line-height: 1.15;
      }

      .speaker-title {
        font-family: "Inter", sans-serif;
        font-size: 23px;
        font-weight: 400;
        color: #475569;
        margin-top: 10px;
        letter-spacing: 1px;
      }

      .speaker-company {
        font-family: "Inter", sans-serif;
        font-size: 21px;
        font-weight: 400;

        color: [[${event.colorPrimary}]];
        margin-top: 8px;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .speaker-photo-wrapper {
        width: 286px;
        height: 286px;
        border-radius: 50%;
        padding: 5px;

        background-color: [[${event.colorAccent}]];
        margin-left: auto;
      }

      .speaker-photo-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        overflow: hidden;
      }

      /* Event-primary footer */
      .footer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1080px;
        height: 100px;

        background: [[${event.colorPrimary}]];
        z-index: 10;
      }

    </style>
    <style th:replace="~{banner/fragments/lighting :: signatureStyle}"></style>
    <style>
      .footer-url { top: 29px; }
      .event-schedule { top: 24px; }
    </style>
  </head>

  <body>
    <!-- Event-color header -->
    <div class="header">
      <div class="header-logo">
        <img th:src="'/images/' + ${event.logoFile}" alt="Event Logo" />
      </div>
      <div th:replace="~{banner/fragments/lighting :: schedule}"></div>
      <div th:replace="~{banner/fragments/lighting :: signature}"></div>
    </div>

    <!-- Accent line -->
    <div class="accent-line"></div>

    <!-- Primary body with the "lights on" overlay -->
    <div class="body-area"></div>
    <div th:replace="~{banner/fragments/lighting :: stage(1080, 856, 'translate(0 0)')}"></div>

    <!-- Intro text -->
    <div class="intro-text" th:text="${event.speakingAboutLabel}">I am speaking about</div>

    <!-- Talk title -->
    <div class="talk-title" th:if="${talk != null and talk.title != null}">
      <div
        class="talk-title-text"
        th:utext="${talk.formattedTitle != null ? talk.formattedTitle : utils.formatTitle(talk.title, 980, 62, 700)}"
      >
        Talk Title Goes Here
      </div>
    </div>

    <!-- Separator -->
    <div class="section-divider"></div>

    <!-- Speaker section -->
    <div class="speaker-section">
      <table>
        <tr>
          <td class="speaker-info-cell">
            <div class="speaker-name" th:text="${speaker.displayName()}">Speaker Name</div>
            <div
              class="speaker-title"
              th:if="${speaker.title != null and !#strings.isEmpty(speaker.title)}"
              th:text="${speaker.title}"
            >
              Speaker Title
            </div>
            <div
              class="speaker-company"
              th:if="${speaker.company != null and !#strings.isEmpty(speaker.company)}"
              th:text="${speaker.company}"
            >
              Company
            </div>
          </td>
          <td class="speaker-photo-cell">
            <div class="speaker-photo-wrapper">
              <div
                class="speaker-photo-inner"
                th:style="${speaker.id != null}
                   ? 'background-image: url(/speaker-photo/' + ${speaker.id} + ')'
                   : 'background-image: url(/speaker-photo)'"
              ></div>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <!-- Accent footer -->
    <div class="footer">
      <div th:replace="~{banner/fragments/lighting :: motto}"></div>
      <div th:replace="~{banner/fragments/lighting :: website}"></div>
    </div>
  </body>
</html>
