<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title th:text="${talk.title} + ' — Talk Banner'">Talk Banner</title>
  <style th:inline="text">
    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 300;
      src: url('/fonts/Poppins-Light.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 400;
      src: url('/fonts/Poppins-Regular.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 600;
      src: url('/fonts/Poppins-SemiBold.ttf') format('truetype');
    }

    @font-face {
      font-family: 'Poppins';
      font-style: normal;
      font-weight: 700;
      src: url('/fonts/Poppins-Bold.ttf') format('truetype');
    }

    @page {
      size: 1280px 720px;
      margin: 0;
      padding: 0;
    }

    body {
      margin: 0;
      padding: 0;
      width: 1280px;
      height: 720px;
      position: relative;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
      color: #ffffff;
      background: #ffffff;
    }

    /* White header bar */
    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 110px;
      background: #ffffff;
      z-index: 10;
    }

    .header-logo {
      position: absolute;
      top: 18px;
      left: 50px;
    }

    .header-logo img {
      height: 75px;
      width: auto;
      display: block;
    }

    .header-hashtag {
      position: absolute;
      top: 32px;
      right: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 40px;
      font-weight: 600;
      color: #999999;
      letter-spacing: 1px;
    }

    /* Accent line below header */
    .accent-line {
      position: absolute;
      top: 110px;
      left: 0;
      width: 1280px;
      height: 4px;

      background: [[${event.colorAccent}]];
      z-index: 10;
    }

    /* Primary gradient body */
    .body-area {
      position: absolute;
      top: 114px;
      left: 0;
      width: 1280px;
      height: 526px;

      background-color: [[${event.colorPrimary}]];
      z-index: 1;
    }

    .body-accent {
      position: absolute;
      top: 114px;
      left: 0;
      width: 1280px;
      height: 526px;

      background-color: transparent;
      z-index: 2;
    }

    /* Session label */
    .session-label {
      position: absolute;
      left: 50px;
      top: 150px;
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 600;

      color: [[${event.colorAccent}]];
      letter-spacing: 4px;
      text-transform: uppercase;
      z-index: 10;
    }

    /* Talk title: left side, large */
    #talk-title {
      position: absolute;
      left: 50px;
      top: 377px;
      transform: translateY(-50%);
      width: 700px;
      font-family: 'Poppins', sans-serif;
      font-size: 53px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      text-align: left;
      hyphens: none;
      word-wrap: break-word;
      z-index: 10;
    }

    /* Speakers container: right side, vertically centred in body area */
    #speakers-container {
      position: absolute;
      right: 50px;
      top: 377px;
      transform: translateY(-50%);
      width: 430px;
      z-index: 10;
    }

    .speaker-item {
      position: relative;
      display: block;
      margin-bottom: 8px;
      height: 140px;
    }

    .speaker-photo-wrapper {
      position: absolute;
      left: 0;
      top: 0;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 4px;

      background-color: [[${event.colorAccent}]];
    }

    .speaker-photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }

    .speaker-details {
      position: absolute;
      left: 150px;
      top: 50%;
      transform: translateY(-50%);
      width: 270px;
    }

    .speaker-name {
      font-family: 'Poppins', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      word-wrap: break-word;
    }

    .speaker-title {
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 3px;
    }

    .speaker-company {
      font-family: 'Poppins', sans-serif;
      font-size: 15px;
      font-weight: 400;

      color: [[${event.colorAccent}]];
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Single speaker: stacked layout (photo on top, text below) */
    .single-speaker .speaker-item {
      height: auto;
      text-align: center;
    }

    .single-speaker .speaker-photo-wrapper {
      position: relative;
      margin: 0 auto;
      width: 220px;
      height: 220px;
    }

    .single-speaker .speaker-details {
      position: relative;
      left: auto;
      top: auto;
      transform: none;
      width: 100%;
      text-align: center;
      margin-top: 15px;
    }

    /* Accent footer bar */
    .footer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 1280px;
      height: 80px;

      background: [[${event.colorAccent}]];
      z-index: 10;
    }

    .footer-left {
      position: absolute;
      bottom: 26px;
      left: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      z-index: 11;
    }

    .footer-right {
      position: absolute;
      bottom: 26px;
      right: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      z-index: 11;
      letter-spacing: 1px;
    }
  </style>
</head>

<body th:classappend="${talk != null and talk.speakers != null and #lists.size(talk.speakers) == 1 ? 'single-speaker' : ''}">
  <!-- White header -->
  <div class="header">
    <div class="header-logo">
      <img th:src="'/images/' + ${event.logoFile}" alt="Event Logo" />
    </div>
    <div class="header-hashtag" th:text="'#' + ${event.shortName}">#VDZ26</div>
  </div>

  <!-- Accent line -->
  <div class="accent-line"></div>

  <!-- Primary gradient body -->
  <div class="body-area"></div>
  <div class="body-accent"></div>

  <!-- Session label -->
  <div class="session-label" th:text="${event.sessionLabel}">Session</div>

  <!-- Talk title -->
  <div id="talk-title" th:if="${talk != null and talk.title != null}" th:utext="${talk.formattedTitle}"
    th:unless="${talk.formattedTitle == null}"></div>
  <div id="talk-title" th:if="${talk != null and talk.title != null and talk.formattedTitle == null}"
    th:utext="${utils.formatTitle(talk.title, 700, 53, 700)}">Talk Title Goes
    Here</div>

  <!-- Speakers list -->
  <div id="speakers-container" th:if="${talk != null and talk.speakers != null}">
    <div class="speaker-item" th:each="speaker : ${talk.speakers}">
      <div class="speaker-photo-wrapper">
        <div class="speaker-photo-inner" th:style="${speaker.id != null}
               ? 'background-image: url(/speaker-photo/' + ${speaker.id} + ')'
               : 'background-color: ' + ${event.colorPrimary} + ';'">
        </div>
      </div>
      <div class="speaker-details">
        <div class="speaker-name" th:text="${speaker.firstName} + ' ' + ${speaker.lastName}">Speaker Name
        </div>
        <div class="speaker-title" th:if="${speaker.title != null and !#strings.isEmpty(speaker.title)}"
          th:text="${speaker.title}">Title</div>
        <div class="speaker-company" th:if="${speaker.company != null and !#strings.isEmpty(speaker.company)}"
          th:text="${speaker.company}">Company</div>
      </div>
    </div>
  </div>

  <!-- Accent footer -->
  <div class="footer"></div>
  <div class="footer-left">
    <span th:if="${event.date != null and !#strings.isEmpty(event.date)}" th:text="${event.date}"></span>
    <span
      th:if="${event.date != null and !#strings.isEmpty(event.date) and event.location != null and !#strings.isEmpty(event.location)}">
      &#183; </span>
    <span th:if="${event.location != null and !#strings.isEmpty(event.location)}" th:text="${event.location}"></span>
  </div>
  <div class="footer-right" th:text="${event.url}">https://voxxeddays.ch</div>
</body>

</html>
