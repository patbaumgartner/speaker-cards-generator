<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title th:text="${talk.title} + ' — Talk Banner'">Talk Banner</title>
    <style th:inline="text">
      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 300;
        src: url("/fonts/Poppins-Light.ttf") format("truetype");
      }

      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/Poppins-Regular.ttf") format("truetype");
      }

      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 600;
        src: url("/fonts/Poppins-SemiBold.ttf") format("truetype");
      }

      @font-face {
        font-family: "Poppins";
        font-style: normal;
        font-weight: 700;
        src: url("/fonts/Poppins-Bold.ttf") format("truetype");
      }

      @page {
        size: 1280px 720px;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        padding: 0;
        width: 1280px;
        height: 720px;
        position: relative;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        color: #0F172A;
        background: #ffffff;
      }

      /* Event-color header bar */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        width: 1280px;
        height: 110px;
        background: [[${event.colorPrimary}]];
        z-index: 10;
      }

      .header-logo {
        position: absolute;
        top: 18px;
        left: 50px;
      }

      .header-logo img {
        height: 75px;
        width: auto;
        display: block;
      }

      /* Accent line below header */
      .accent-line {
        position: absolute;
        top: 110px;
        left: 0;
        width: 1280px;
        height: 4px;

        background: [[${event.colorAccent}]];
        z-index: 10;
      }

      /* Base beneath the stage lighting */
      .body-area {
        position: absolute;
        top: 114px;
        left: 0;
        width: 1280px;
        height: 526px;

        background-color: #F8FAFC;
        z-index: 1;
      }

      /* Event-coloured stage lighting */
      .lighting {
        position: absolute;
        top: 114px;
        left: 0;
        width: 1280px;
        height: 526px;
        display: block;
        z-index: 2;
      }

      /* Session label */
      .session-label {
        position: absolute;
        left: 50px;
        top: 150px;
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 600;

        color: [[${event.colorPrimary}]];
        letter-spacing: 4px;
        text-transform: uppercase;
        z-index: 10;
      }

      /* Talk title: left side, large */
      #talk-title {
        position: absolute;
        left: 50px;
        top: 377px;
        transform: translateY(-50%);
        width: 700px;
        font-family: "Poppins", sans-serif;
        font-size: 53px;
        font-weight: 700;
        color: #0F172A;
        line-height: 1.2;
        text-align: left;
        hyphens: none;
        word-wrap: break-word;
        z-index: 10;
      }

      /* Speakers container: right side, vertically centred in body area */
      #speakers-container {
        position: absolute;
        right: 50px;
        top: 377px;
        transform: translateY(-50%);
        width: 430px;
        z-index: 10;
      }

      .speaker-item {
        position: relative;
        display: block;
        margin-bottom: 12px;
        min-height: 136px;
        background-color: #FFFFFF;
        border-radius: 18px;
      }

      .speaker-photo-wrapper {
        position: absolute;
        left: 14px;
        top: 14px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        padding: 4px;

        background-color: [[${event.colorAccent}]];
      }

      .speaker-photo-inner {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background-size: cover;
        background-position: center;
        overflow: hidden;
      }

      .speaker-details {
        padding: 18px 16px 18px 140px;
        word-wrap: break-word;
      }

      .speaker-name {
        font-family: "Poppins", sans-serif;
        font-size: 30px;
        font-weight: 700;
        color: #0F172A;
        line-height: 1.2;
        word-wrap: break-word;
      }

      .speaker-title {
        font-family: "Poppins", sans-serif;
        font-size: 17px;
        font-weight: 400;
        color: #475569;
        margin-top: 3px;
      }

      .speaker-company {
        font-family: "Poppins", sans-serif;
        font-size: 15px;
        font-weight: 400;

        color: [[${event.colorPrimary}]];
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-top: 2px;
      }

      /* Single speaker: stacked layout (photo on top, text below) */
      .single-speaker .speaker-item {
        padding: 20px;
        text-align: center;
      }

      .single-speaker .speaker-photo-wrapper {
        position: relative;
        left: auto;
        top: auto;
        margin: 0 auto;
        width: 220px;
        height: 220px;
      }

      .single-speaker .speaker-details {
        padding: 14px 0 0;
      }

      /* Event-primary footer */
      .footer {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 1280px;
        height: 80px;

        background: [[${event.colorPrimary}]];
        z-index: 10;
      }

    </style>
    <style th:replace="~{banner/fragments/lighting :: signatureStyle}"></style>
  </head>

  <body
    th:classappend="${talk != null and talk.speakers != null and #lists.size(talk.speakers) == 1 ? 'single-speaker' : ''}"
  >
    <!-- Event-color header -->
    <div class="header">
      <div class="header-logo">
        <img th:src="'/images/' + ${event.logoFile}" alt="Event Logo" />
      </div>
      <div th:replace="~{banner/fragments/lighting :: schedule}"></div>
      <div th:replace="~{banner/fragments/lighting :: signature}"></div>
    </div>

    <!-- Accent line -->
    <div class="accent-line"></div>

    <!-- Primary body with the "lights on" overlay -->
    <div class="body-area"></div>
    <div th:replace="~{banner/fragments/lighting :: stage(1280, 526, 'translate(0 0)')}"></div>

    <!-- Session label -->
    <div class="session-label" th:text="${event.sessionLabel}">Session</div>

    <!-- Talk title -->
    <div
      id="talk-title"
      th:if="${talk != null and talk.title != null}"
      th:utext="${talk.formattedTitle != null ? talk.formattedTitle : utils.formatTitle(talk.title, 700, 53, 700)}"
    >
      Talk Title Goes Here
    </div>

    <!-- Speakers list -->
    <div id="speakers-container" th:if="${talk != null and talk.speakers != null}">
      <div class="speaker-item" th:each="speaker : ${talk.speakers}">
        <div class="speaker-photo-wrapper">
          <div
            class="speaker-photo-inner"
            th:style="${speaker.id != null}
               ? 'background-image: url(/speaker-photo/' + ${speaker.id} + ')'
               : 'background-image: url(/speaker-photo)'"
          ></div>
        </div>
        <div class="speaker-details">
          <div class="speaker-name" th:text="${speaker.displayName()}">Speaker Name</div>
          <div
            class="speaker-title"
            th:if="${speaker.title != null and !#strings.isEmpty(speaker.title)}"
            th:text="${speaker.title}"
          >
            Title
          </div>
          <div
            class="speaker-company"
            th:if="${speaker.company != null and !#strings.isEmpty(speaker.company)}"
            th:text="${speaker.company}"
          >
            Company
          </div>
        </div>
      </div>
    </div>

    <!-- Accent footer -->
    <div class="footer">
      <div th:replace="~{banner/fragments/lighting :: motto}"></div>
      <div th:replace="~{banner/fragments/lighting :: website}"></div>
    </div>
  </body>
</html>
