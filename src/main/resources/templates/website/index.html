<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{website/main :: layout(~{::section#main-content})}">

<section id="main-content">

<!-- Page Header -->
<div class="row mb-4">
  <div class="col-12">
    <div class="bg-white rounded shadow-sm p-4">
      <h1 class="display-5 fw-bold text-primary mb-2">
        <i class="bi bi-mic-fill me-3" style="font-size: 48px;"></i>
        <span th:text="${event.name}">Conference</span> – Speakers
      </h1>
      <p class="lead text-muted mb-0">
        Browse our distinguished speakers and their professional profiles
      </p>
    </div>
  </div>
</div>

<!-- Import Section -->
<div class="row mb-4">
  <div class="col-12">
    <div class="card shadow-sm border-0">
      <div class="card-header card-header-vd d-flex align-items-center gap-2">
        <i class="bi bi-cloud-download-fill"></i>
        <h5 class="mb-0">Import Speakers</h5>
      </div>
      <div class="card-body">
        <p class="text-muted mb-3">
          Load speaker data from the Devoxx CFP API or from a local XLSX file.
        </p>
        <div class="d-flex flex-wrap gap-3 align-items-center">
          <button type="button" class="btn btn-primary" id="btnImportDevoxx"
                  data-import-type="devoxx">
            <i class="bi bi-cloud-arrow-down me-2"></i>Import from Devoxx API
          </button>
          <button type="button" class="btn btn-outline-primary" id="btnImportXlsx"
                  data-import-type="csv">
            <i class="bi bi-file-earmark-spreadsheet me-2"></i>Import from XLSX
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Speakers Table -->
<div class="row">
  <div class="col-12">
    <div class="card shadow-sm">
      <div class="card-header card-header-vd">
        <h5 class="mb-0">
          <i class="bi bi-list-ul me-2"></i>Speaker List
        </h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="text-center" style="width: 80px;">Photo</th>
                <th scope="col">Name</th>
                <th scope="col">Title</th>
                <th scope="col">Company</th>
                <th scope="col" class="text-center">Social Links</th>
                <th scope="col" class="text-center" style="width: 200px;">Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="speaker : ${speakers}">

                <!-- Photo -->
                <td class="text-center align-middle">
                  <img th:src="@{/speaker-photo/{id}(id=${speaker.id})}"
                       th:alt="${speaker.firstName} + ' ' + ${speaker.lastName}"
                       class="rounded-circle"
                       style="width: 50px; height: 50px; object-fit: cover;" />
                </td>

                <!-- Name -->
                <td class="align-middle">
                  <div class="fw-bold text-dark"
                       th:text="${speaker.firstName} + ' ' + ${speaker.lastName}">Name</div>
                </td>

                <!-- Title -->
                <td class="align-middle">
                  <span class="text-muted" th:text="${speaker.title}"></span>
                </td>

                <!-- Company -->
                <td class="align-middle">
                  <a th:if="${speaker.companyURL != null}"
                     th:href="${speaker.companyURL}"
                     target="_blank"
                     class="text-decoration-none text-primary"
                     title="Visit company website">
                    <span th:text="${speaker.company}"></span>
                    <i class="bi bi-box-arrow-up-right ms-1" style="font-size: 12px;"></i>
                  </a>
                  <span th:unless="${speaker.companyURL != null}"
                        class="text-dark"
                        th:text="${speaker.company}"></span>
                </td>

                <!-- Social Links -->
                <td class="align-middle text-center">
                  <div class="btn-group" role="group">
                    <a th:if="${speaker.twitterAccount != null}"
                       th:href="'https://twitter.com/' + ${speaker.twitterAccount}"
                       target="_blank"
                       class="btn btn-sm btn-outline-info"
                       title="X / Twitter">
                      <i class="bi bi-twitter-x"></i>
                    </a>
                    <a th:if="${speaker.linkedInAccount != null}"
                       th:href="'https://linkedin.com/in/' + ${speaker.linkedInAccount}"
                       target="_blank"
                       class="btn btn-sm btn-outline-primary"
                       title="LinkedIn">
                      <i class="bi bi-linkedin"></i>
                    </a>
                    <a th:if="${speaker.githubAccount != null}"
                       th:href="'https://github.com/' + ${speaker.githubAccount}"
                       target="_blank"
                       class="btn btn-sm btn-outline-dark"
                       title="GitHub">
                      <i class="bi bi-github"></i>
                    </a>
                    <a th:if="${speaker.blogURL != null}"
                       th:href="${speaker.blogURL}"
                       target="_blank"
                       class="btn btn-sm btn-outline-success"
                       title="Blog">
                      <i class="bi bi-globe"></i>
                    </a>
                  </div>
                </td>

                <!-- Actions -->
                <td class="align-middle text-center">
                  <div class="d-flex flex-column gap-1">
                    <!-- Speaker banner -->
                    <div class="btn-group btn-group-sm" role="group">
                      <a th:href="@{/speaker-banner/{id}(id=${speaker.id})}"
                         target="_blank"
                         class="btn btn-outline-primary"
                         title="Preview Speaker Banner">
                        <i class="bi bi-eye me-1"></i>View
                      </a>
                      <a th:href="@{/speaker-banner/{id}.png(id=${speaker.id})}"
                         th:attr="download='speaker-' + ${speaker.id} + '.png'"
                         class="btn btn-outline-primary"
                         title="Download Speaker Banner PNG">
                        <i class="bi bi-download"></i>
                      </a>
                    </div>
                    <!-- Talk banner (only when speaker has talks) -->
                    <div class="btn-group btn-group-sm" role="group"
                         th:if="${!#lists.isEmpty(speaker.talks)}">
                      <a th:href="@{/talk-banner/{id}(id=${speaker.talks[0].id})}"
                         target="_blank"
                         class="btn btn-outline-success"
                         title="Preview Talk Banner">
                        <i class="bi bi-eye me-1"></i>View
                      </a>
                      <a th:href="@{/talk-banner/{id}.png(id=${speaker.talks[0].id})}"
                         th:attr="download='talk-' + ${speaker.talks[0].id} + '.png'"
                         class="btn btn-outline-success"
                         title="Download Talk Banner PNG">
                        <i class="bi bi-download"></i>
                      </a>
                    </div>
                  </div>
                </td>

              </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer text-muted text-center">
        <small>Total Speakers: <strong th:text="${#lists.size(speakers)}">0</strong></small>
      </div>
    </div>
  </div>
</div>

</section>
</html>
