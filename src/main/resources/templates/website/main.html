<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<head>
    <title th:text="'Speaker Cards – ' + ${event.name}">Speaker Cards Generator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS via WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons via WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <!-- Custom application styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg" aria-label="Main navigation">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" aria-label="Go to speaker directory">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                     class="bi bi-people-fill me-2" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                    <path d="M7 14s-1 0-1-1 1-4 5-4 5 3 5 4-1 1-1 1zm4-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6m-5.784
                             6A2.238 2.238 0 0 1 5 13c0-1.355.68-2.75 1.936-3.72A6.325 6.325 0 0 0 5 9c-4 0-5
                             3-5 4s1 1 1 1zM4.5 8a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5"/>
                </svg>
                <span th:text="${event.name}">Speaker Directory</span>
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/" aria-current="page">
                            <i class="bi bi-people me-1" aria-hidden="true"></i>Speakers
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content – replaced by the page-specific fragment -->
    <main class="main-content" id="main-content">
        <div class="container" th:insert="${content}">
            <!-- Page content is injected here -->
        </div>
    </main>

    <!-- Footer -->
    <footer role="contentinfo">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Speaker Cards —
                <a th:href="${event.url}" target="_blank" rel="noopener noreferrer"
                   th:text="${event.name}">Conference</a>.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
