<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      th:fragment="layout(content)">
<head>
    <title>Speaker Cards Generator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS via WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <!-- Bootstrap Icons via WebJars -->
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.css}">
    <!-- Custom application styles -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-people-fill me-2"></i>Speaker Directory
            </a>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                    <li class="nav-item">
                        <a class="nav-link active" href="/"><i class="bi bi-mic-fill me-1"></i>Speakers</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="importDropdown"
                           role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-cloud-download-fill me-1"></i>Import
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="importDropdown">
                            <li>
                                <button class="dropdown-item" data-import-type="devoxx">
                                    <i class="bi bi-cloud-arrow-down me-2 text-primary"></i>Import from Devoxx API
                                </button>
                            </li>
                            <li>
                                <button class="dropdown-item" data-import-type="csv">
                                    <i class="bi bi-file-earmark-spreadsheet me-2 text-primary"></i>Import from XLSX
                                </button>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Import toast notification -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index:9999;">
        <div id="importToast" class="toast align-items-center text-white border-0" role="alert"
             aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="importToastBody">Import complete.</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Main Content – replaced by the page-specific fragment -->
    <div class="main-content">
        <div class="container" th:insert="${content}">
            <!-- Page content is injected here -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center">
        <div class="container">
            <p class="mb-0">&copy; 2026 Speaker Directory — powered by
                <a th:href="${event.url}" target="_blank" th:text="${event.name}" class="text-light">Conference</a>.
                All rights reserved.
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Import helper: calls REST endpoint, shows toast, reloads page on success -->
    <script>
        var RELOAD_DELAY_MS = 2000;
        var ALLOWED_IMPORT_TYPES = { devoxx: true, csv: true };

        function triggerImport(type, btn) {
            if (!ALLOWED_IMPORT_TYPES[type]) { return; }
            var origHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML =
                '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Importing\u2026';

            fetch('/api/import/' + type)
                .then(function(r) {
                    return r.text().then(function(text) {
                        return { ok: r.ok, text: text };
                    });
                })
                .then(function(result) {
                    showImportToast(result.ok, result.text);
                    if (result.ok) {
                        setTimeout(function() { window.location.reload(); }, RELOAD_DELAY_MS);
                    }
                })
                .catch(function(err) {
                    showImportToast(false, 'Import failed: ' + err.message);
                })
                .finally(function() {
                    btn.disabled = false;
                    btn.innerHTML = origHTML;
                });
        }

        function showImportToast(success, message) {
            var toastEl = document.getElementById('importToast');
            var toastBody = document.getElementById('importToastBody');
            toastEl.classList.remove('bg-success', 'bg-danger');
            toastEl.classList.add(success ? 'bg-success' : 'bg-danger');
            toastBody.textContent = message;
            var toast = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 4000 });
            toast.show();
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[data-import-type]').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    triggerImport(btn.dataset.importType, btn);
                });
            });
        });
    </script>
</body>
</html>
