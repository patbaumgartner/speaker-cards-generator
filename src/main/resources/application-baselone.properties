# =============================================================================
# BaselOne profile
# Activate with: --spring.profiles.active=baselone
# =============================================================================

app.event.name=BaselOne
app.event.short-name=BaselOne
app.event.url=https://baselone.ch
app.event.logo-file=logo-baselone.png
app.event.date=October 14-15, 2026
app.event.location=Basel, Switzerland
app.event.color-primary=#1F0D3D
app.event.color-accent=#7B35C1
app.event.session-label=Session
app.event.speaking-about-label=I am speaking about

# BaselOne uses Sessionize import (XLSX/CSV), not the Devoxx CFP API.
# Set to 'none' (or leave empty) to disable CFP API import for this profile.
app.devoxx.api.event-id=none
