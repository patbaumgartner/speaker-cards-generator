# Shared configuration for @SpringBootTest classes: an in-memory database so the suite
# needs neither PostgreSQL nor Docker.
spring.datasource.url=jdbc:h2:mem:speakercards;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

logging.level.com.openhtmltopdf=WARN
logging.level.org.apache.pdfbox=WARN

# Docker Compose support would otherwise try to start compose.yml during tests.
spring.docker.compose.enabled=false

app.event.name=Test Conference
app.event.short-name=TC26
app.event.url=https://example.com
app.event.date=March 24, 2026
app.event.location=Zurich, Switzerland
app.devoxx.api.event-id=none
